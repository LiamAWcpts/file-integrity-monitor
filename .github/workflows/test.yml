# runs test.sh on github every time something gets pushed
name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install g++, make and openssl
        run: sudo apt-get update && sudo apt-get install -y g++ make libssl-dev

      - name: run the tests
        run: bash test.sh
